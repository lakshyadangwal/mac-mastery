name: Lint Markdown

on:
  pull_request:
    branches: [ main ]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: ibiqlik/action-markdownlint@v3
        with:
          config_file: .markdownlint.yml
